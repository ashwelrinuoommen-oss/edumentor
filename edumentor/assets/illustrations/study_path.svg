<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D8E8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Nodes and Edges -->
  <line x1="50" y1="60" x2="150" y2="30" stroke="url(#edgeGrad)" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="50" y1="60" x2="150" y2="90" stroke="url(#edgeGrad)" stroke-width="2"/>
  <line x1="150" y1="30" x2="250" y2="60" stroke="url(#edgeGrad)" stroke-width="2"/>
  <line x1="150" y1="90" x2="250" y2="60" stroke="url(#edgeGrad)" stroke-width="2"/>
  <!-- Tier 0 Node -->
  <circle cx="50" cy="60" r="14" fill="#0D1117" stroke="#25D8E8" stroke-width="2"/>
  <text x="50" y="64" fill="#25D8E8" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">T0</text>
  <!-- Tier 1 Nodes -->
  <circle cx="150" cy="30" r="14" fill="#0D1117" stroke="#8B5CF6" stroke-width="2"/>
  <text x="150" y="34" fill="#8B5CF6" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">T1</text>
  <circle cx="150" cy="90" r="14" fill="#0D1117" stroke="#8B5CF6" stroke-width="2"/>
  <text x="150" y="94" fill="#8B5CF6" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">T1</text>
  <!-- Tier 2 Node -->
  <circle cx="250" cy="60" r="14" fill="#0D1117" stroke="#10B981" stroke-width="2"/>
  <text x="250" y="64" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">T2</text>
</svg>
